<!DOCTYPE html>
<html>
<head>
    <title>Lấy Key Free </title>
    <meta charset="utf-8">
    <style>
        body { font-family: Arial; text-align: center; padding: 50px; }
        .key-box { background: #f0f0f0; padding: 20px; border-radius: 10px; margin: 20px; }
        .loading { color: orange; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>🔑 LẤY KEY KÍCH HOẠT</h1>
    
    <div id="status" class="loading">⏳ Đang xác thực...</div>
    <div id="key-box" class="key-box" style="display:none;"></div>
    
    <script>
        // Lấy token từ URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        
        if (!token) {
            document.getElementById('status').innerHTML = '❌ Thiếu token!';
            document.getElementById('status').className = 'error';
        } else {
            // Gửi request xác nhận đã xem quảng cáo
            // (Thực tế, sau khi user xem QC xong, redirect về đây)
            
            // Giả lập chờ 5 giây (thời gian xem QC)
            setTimeout(() => {
                // Gọi API để lấy key
                fetch(`https://your-server.com/get-key?token=${token}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.success) {
                            document.getElementById('status').innerHTML = '✅ XÁC THỰC THÀNH CÔNG!';
                            document.getElementById('status').className = 'success';
                            document.getElementById('key-box').innerHTML = `
                                <h2>KEY CỦA BẠN:</h2>
                                <code style="font-size: 24px; font-weight: bold;">${data.key}</code>
                                <p><br/>Hãy copy key này và dán vào tool!</p>
                                <p>Key có hiệu lực trong 1 giờ.</p>
                            `;
                            document.getElementById('key-box').style.display = 'block';
                        } else {
                            document.getElementById('status').innerHTML = '❌ ' + data.error;
                            document.getElementById('status').className = 'error';
                        }
                    })
                    .catch(err => {
                        document.getElementById('status').innerHTML = '❌ Lỗi kết nối server!';
                        document.getElementById('status').className = 'error';
                    });
            }, 5000); // Chờ 5 giây (thời gian xem QC)
        }
    </script>
</body>
</html>
